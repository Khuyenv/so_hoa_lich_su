# ===================================================================
# CẤU HÌNH ỨNG DỤNG SỐ HÓA LUẬT TỤC & HƯƠNG ƯỚC LÀNG XÃ (MÃ C05)
# ===================================================================
spring.application.name=luat_tuc_hon_uoc_trong_lang
server.port=8080

# ===================================================================
# GIAI ĐOẠN 1: CẤU HÌNH KẾT NỐI MS SQL SERVER (MÁY CỤC BỘ)
# Kết nối cổng TCP 1433 tới database luat_tuc_huong_uoc_db
# ===================================================================
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=luat_tuc_huong_uoc_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=20062006moi
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA: Tự động cập nhật bảng trong database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CẤU HÌNH THYMELEAF & MÃ HÓA TIẾNG VIỆT UTF-8
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
