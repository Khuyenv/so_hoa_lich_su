# ===================================================================
# GIAI ĐOẠN 2: CẤU HÌNH KẾT NỐI ONLINE (CLOUD / SERVER PRODUCTION)
# Kích hoạt profile bằng cách: --spring.profiles.active=online
# hoặc gán biến môi trường: SPRING_PROFILES_ACTIVE=online
# ===================================================================

# Cấu hình DataSource linh hoạt qua biến môi trường hoặc cấu hình máy chủ đám mây
spring.datasource.url=${DB_URL:jdbc:sqlserver://your-online-db-server.database.windows.net:1433;databaseName=luat_tuc_huong_uoc_db;encrypt=true;trustServerCertificate=false;}
spring.datasource.username=${DB_USERNAME:cloud_sa}
spring.datasource.password=${DB_PASSWORD:StrongPasswordOnline@2026}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Trên môi trường Online: validate schema thay vì tự ý drop/update cấu trúc
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Bật bộ nhớ đệm Thymeleaf trên môi trường Production
spring.thymeleaf.cache=true

# Cổng lắng nghe có thể cấu hình động (Render, Railway, Azure App Service, Heroku)
server.port=${PORT:8080}
