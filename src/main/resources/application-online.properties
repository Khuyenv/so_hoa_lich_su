# ===================================================================
# GIAI ĐOẠN 2: CẤU HÌNH ONLINE TRÊN RENDER.COM / CLOUD
# Kích hoạt profile: --spring.profiles.active=online
# hoặc gán biến môi trường: SPRING_PROFILES_ACTIVE=online
# ===================================================================

# Cổng Render cấp phát động qua biến môi trường PORT
server.port=${PORT:8080}

# Cấu hình DataSource linh hoạt:
# 1. Nếu bạn kết nối MS SQL Server Cloud (Azure SQL / VPS):
#    Khai báo DB_URL=jdbc:sqlserver://your-host:1433;databaseName=luat_tuc_huong_uoc_db;encrypt=true;trustServerCertificate=true;
# 2. Nếu deploy trực tiếp Render miễn phí không cần server database ngoài:
#    Mặc định tự động dùng H2 file database lưu tại ./data/customs_db cực kỳ tiện lợi
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/luat_tuc_huong_uoc_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}

# JPA Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf caching trên production
spring.thymeleaf.cache=true

# Mã hóa tiếng Việt UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
