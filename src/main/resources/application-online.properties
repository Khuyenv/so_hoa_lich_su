# ===================================================================

# Cổng Render cấp phát động qua biến môi trường PORT
server.port=${PORT:8080}

# Cấu hình DataSource:
# Mặc định sử dụng H2 In-Memory (chạy 100% trong RAM, không lo phân quyền ổ đĩa)
spring.datasource.url=${DB_URL:jdbc:h2:mem:luat_tuc_huong_uoc_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# Chỉ định rõ H2Dialect để Hibernate không cần truy vấn JDBC metadata
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf cache
spring.thymeleaf.cache=true

# Mã hóa tiếng Việt UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
