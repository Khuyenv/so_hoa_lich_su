# ===================================================================
# GIAI ĐOẠN 1 (DỰ PHÒNG): CHẠY HOÀN TOÀN OFFLINE VỚI H2 EMBEDDED
# Dành cho trường hợp chạy thử nghiệm nhanh không cần cài đặt SQL Server
# Kích hoạt profile: --spring.profiles.active=offline-h2
# ===================================================================

spring.datasource.url=jdbc:h2:file:./data/luat_tuc_huong_uoc_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
