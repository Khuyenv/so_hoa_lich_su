<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${regulation.title} + ' - Di Sản Số Hóa (C05)'">Chi Tiết Di Sản Số Hóa</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --heritage-primary: #872323;
            --heritage-secondary: #c28834;
            --heritage-dark: #2c1810;
            --heritage-bg: #f9f6f0;
        }

        body {
            background-color: var(--heritage-bg);
            font-family: 'Roboto', sans-serif;
            color: #333;
        }

        .navbar-heritage {
            background: linear-gradient(135deg, var(--heritage-dark) 0%, var(--heritage-primary) 100%);
            border-bottom: 3px solid var(--heritage-secondary);
        }

        .card-custom {
            border: 1px solid rgba(194, 136, 52, 0.25);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            background: #fff;
        }

        .heritage-title {
            font-family: 'Playfair Display', serif;
            color: var(--heritage-primary);
        }

        .heritage-content {
            font-family: 'Merriweather', serif;
            font-size: 1.05rem;
            line-height: 1.8;
            white-space: pre-wrap;
            background-color: #fdfbf7;
            border-left: 4px solid var(--heritage-secondary);
            padding: 1.5rem;
            border-radius: 4px;
        }

        .significance-box {
            background-color: #fff8eb;
            border: 1px dashed var(--heritage-secondary);
            padding: 1.2rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-heritage mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/customs}">
                <i class="bi bi-book-half fs-3 me-2 text-warning"></i>
                <div>
                    <span class="fw-bold fs-5">DI SẢN VĂN HÓA LÀNG XÃ</span>
                    <span class="badge bg-warning text-dark ms-2">Mã C05</span>
                </div>
            </a>
            <div class="ms-auto d-flex gap-2">
                <a th:href="@{/customs}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Danh sách
                </a>
                <a th:href="@{/customs/new}" class="btn btn-warning btn-sm text-dark fw-bold">
                    <i class="bi bi-plus-lg me-1"></i> Thêm mới
                </a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card card-custom p-4 p-md-5">
                    <div class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-3 flex-wrap gap-2">
                        <div>
                            <span class="badge bg-danger mb-2" th:text="${regulation.category}"></span>
                            <span class="badge bg-secondary mb-2" th:text="${regulation.historicalPeriod}"></span>
                            <h2 class="heritage-title fw-bold mb-1" th:text="${regulation.title}"></h2>
                            <div class="text-muted">
                                <i class="bi bi-geo-alt-fill text-danger me-1"></i>
                                <span th:text="${regulation.villageName + ', ' + regulation.commune + ', ' + regulation.district + ', ' + regulation.province}"></span>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <a th:href="@{/customs/edit/{id}(id=${regulation.id})}" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-pencil me-1"></i> Chỉnh sửa
                            </a>
                        </div>
                    </div>

                    <!-- Nội dung điều lệ -->
                    <div class="mb-4">
                        <h5 class="fw-bold text-dark mb-3">
                            <i class="bi bi-file-earmark-text text-danger me-2"></i> Toàn văn / Trích dẫn Luật tục & Hương ước:
                        </h5>
                        <div class="heritage-content" th:text="${regulation.content}"></div>
                    </div>

                    <!-- Ý nghĩa lịch sử -->
                    <div class="mb-4" th:if="${regulation.significance != null and !regulation.significance.isBlank()}">
                        <h5 class="fw-bold text-dark mb-2">
                            <i class="bi bi-lightbulb-fill text-warning me-2"></i> Ý nghĩa văn hóa & lịch sử:
                        </h5>
                        <div class="significance-box text-dark" th:text="${regulation.significance}"></div>
                    </div>

                    <!-- Nguồn dẫn chứng -->
                    <div class="border-top pt-3 text-muted small" th:if="${regulation.sourceReference != null and !regulation.sourceReference.isBlank()}">
                        <strong><i class="bi bi-journal-bookmark me-1"></i> Nguồn gốc tài liệu / Dẫn chứng:</strong>
                        <span th:text="${regulation.sourceReference}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
