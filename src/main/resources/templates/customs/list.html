<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Di Sản Số Hóa - Luật Tục & Hương Ước (Mã C05)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --heritage-primary: #872323;
            --heritage-secondary: #c28834;
            --heritage-dark: #2c1810;
            --heritage-bg: #f9f6f0;
        }

        body {
            background-color: var(--heritage-bg);
            font-family: 'Roboto', sans-serif;
            color: #333;
        }

        .navbar-heritage {
            background: linear-gradient(135deg, var(--heritage-dark) 0%, var(--heritage-primary) 100%);
            border-bottom: 3px solid var(--heritage-secondary);
        }

        .badge-code {
            background-color: #ffd97d;
            color: #744210;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.35em 0.8em;
            border-radius: 6px;
        }

        .btn-heritage-primary {
            background-color: var(--heritage-primary);
            border-color: var(--heritage-primary);
            color: #ffffff;
            font-weight: 600;
        }

        .btn-heritage-primary:hover {
            background-color: #6e1c1c;
            color: #fff;
        }

        .category-badge {
            background-color: #f1e7d8;
            color: #6b401d;
            border: 1px solid #d8be98;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.3em 0.6em;
            border-radius: 4px;
        }

        .card-custom {
            border: 1px solid rgba(194, 136, 52, 0.25);
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            background: #fff;
        }

        .table-hover tbody tr:hover {
            background-color: #faf5ed;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-heritage mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/customs}">
                <i class="bi bi-book-half fs-3 me-2 text-warning"></i>
                <div>
                    <span class="fw-bold fs-5">DI SẢN VĂN HÓA LÀNG XÃ</span>
                    <span class="badge badge-code ms-2">Mã C05</span>
                    <div class="small text-white-50" style="font-size: 0.75rem;">Hệ thống số hóa Luật tục & Hương ước làng xã</div>
                </div>
            </a>

            <div class="ms-auto d-flex gap-2">
                <a th:href="@{/customs/new}" class="btn btn-warning text-dark fw-bold">
                    <i class="bi bi-plus-circle-fill me-1"></i> Thêm bản ghi mới
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container pb-5">

        <!-- Thông báo flash -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Thanh tìm kiếm & lọc -->
        <div class="card card-custom p-3 mb-4">
            <form th:action="@{/customs}" method="GET" class="row g-2 align-items-center">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                               placeholder="Tìm kiếm theo tiêu đề hương ước...">
                    </div>
                </div>
                <div class="col-md-4">
                    <select name="category" class="form-select">
                        <option value="">-- Tất cả nhóm phân loại --</option>
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"
                                th:selected="${cat == selectedCategory}"></option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-heritage-primary flex-grow-1">
                        <i class="bi bi-funnel me-1"></i> Tìm kiếm & Lọc
                    </button>
                    <a th:href="@{/customs}" class="btn btn-outline-secondary" title="Xóa bộ lọc">
                        <i class="bi bi-arrow-clockwise"></i>
                    </a>
                </div>
            </form>
        </div>

        <!-- Danh sách bảng dữ liệu -->
        <div class="card card-custom">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
                <h5 class="mb-0 fw-bold text-dark">
                    <i class="bi bi-journal-text me-2 text-danger"></i>
                    Danh mục Hương ước / Luật tục đã số hóa
                </h5>
                <span class="badge bg-secondary" th:text="${regulations != null ? regulations.size() + ' bản ghi' : '0 bản ghi'}"></span>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" style="width: 5%;">#ID</th>
                            <th scope="col" style="width: 30%;">Tiêu đề hương ước / lệ tục</th>
                            <th scope="col" style="width: 15%;">Nhóm phân loại</th>
                            <th scope="col" style="width: 20%;">Địa bàn làng xã</th>
                            <th scope="col" style="width: 15%;">Thời kỳ lịch sử</th>
                            <th scope="col" style="width: 15%;" class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${regulations == null or #lists.isEmpty(regulations)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                Chưa có bản ghi di sản nào trong cơ sở dữ liệu.<br>
                                <a th:href="@{/customs/new}" class="btn btn-sm btn-heritage-primary mt-2">
                                    <i class="bi bi-plus-lg me-1"></i> Bắt đầu số hóa ngay
                                </a>
                            </td>
                        </tr>

                        <tr th:each="item : ${regulations}">
                            <td class="fw-bold text-muted" th:text="${item.id}"></td>
                            <td>
                                <a th:href="@{/customs/{id}(id=${item.id})}" class="fw-bold text-decoration-none text-dark d-block" th:text="${item.title}"></a>
                                <small class="text-muted text-truncate d-inline-block" style="max-width: 320px;" th:text="${item.sourceReference}"></small>
                            </td>
                            <td>
                                <span class="category-badge" th:text="${item.category}"></span>
                            </td>
                            <td>
                                <div class="fw-semibold text-primary" th:text="${item.villageName}"></div>
                                <small class="text-muted" th:text="${item.commune + ', ' + item.district + ', ' + item.province}"></small>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${item.historicalPeriod}"></span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/customs/{id}(id=${item.id})}" class="btn btn-outline-info" title="Xem chi tiết">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/customs/edit/{id}(id=${item.id})}" class="btn btn-outline-warning" title="Chỉnh sửa">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/customs/delete/{id}(id=${item.id})}" method="POST"
                                          onsubmit="return confirm('Bạn có chắc chắn muốn xóa bản ghi số hóa này không?');"
                                          style="display: inline;">
                                        <button type="submit" class="btn btn-outline-danger" title="Xóa">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
