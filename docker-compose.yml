version: '3.8'

services:
  # Dịch vụ Cơ sở dữ liệu MS SQL Server
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-customs-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=StrongPasswordOnline@2026
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - customs-network
    restart: always

  # Ứng dụng Spring Boot
  customs-app:
    build: .
    container_name: customs-heritage-app
    depends_on:
      - mssql-db
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=online
      - DB_URL=jdbc:sqlserver://mssql-db:1433;databaseName=luat_tuc_huong_uoc_db;encrypt=true;trustServerCertificate=true;
      - DB_USERNAME=sa
      - DB_PASSWORD=StrongPasswordOnline@2026
    networks:
      - customs-network
    restart: always

volumes:
  mssql_data:

networks:
  customs-network:
    driver: bridge
